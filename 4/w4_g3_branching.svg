<text x="351" y="403" text-anchor="middle" font-size="16" font-weight="normal" fill="#152238">tak</text>
<text x="205" y="207" text-anchor="middle" font-size="16" font-weight="normal" fill="#152238">nie</text>
<text x="205" y="349" text-anchor="middle" font-size="16" font-weight="normal" fill="#152238">nie</text>
<text x="205" y="483" text-anchor="middle" font-size="16" font-weight="normal" fill="#152238">nie</text>
<text x="974" y="119" text-anchor="middle" font-size="16" font-weight="normal" fill="#152238">tak</text>
<text x="826" y="208" text-anchor="middle" font-size="16" font-weight="normal" fill="#152238">nie</text>
<text x="974" y="271" text-anchor="middle" font-size="16" font-weight="normal" fill="#152238">tak</text>
<text x="826" y="364" text-anchor="middle" font-size="16" font-weight="normal" fill="#152238">nie</text>
<text x="965" y="538" text-anchor="middle" font-size="19" font-weight="normal" fill="#152238">W łańcuchu wykonywana jest dokładnie jedna gałąź</text></g></svg>
