<g id="ind2"><polygon points="232.5,238 330,272.5 232.5,307 135,272.5" fill="#fffaf0" stroke="#27364b" stroke-width="2"/><text x="232.5" y="279.3" text-anchor="middle" font-size="20" fill="#152238">x &lt; 10?</text></g>
