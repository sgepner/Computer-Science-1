<g id="chain1"><polygon points="852.5,95 955,133 852.5,171 750,133" fill="#fffaf0" stroke="#27364b" stroke-width="2"/><text x="852.5" y="139.8" text-anchor="middle" font-size="20" fill="#152238">x &lt; 0?</text></g>
