<g id="ind3"><polygon points="232.5,381 330,415.5 232.5,450 135,415.5" fill="#fffaf0" stroke="#27364b" stroke-width="2"/><text x="232.5" y="422.3" text-anchor="middle" font-size="20" fill="#152238">x == 7?</text></g>
