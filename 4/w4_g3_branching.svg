<g id="ind1"><polygon points="232.5,95 330,129.5 232.5,164 135,129.5" fill="#fffaf0" stroke="#27364b" stroke-width="2"/><text x="232.5" y="136.3" text-anchor="middle" font-size="20" fill="#152238">x &gt; 0?</text></g>
