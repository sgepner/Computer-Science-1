<text x="320" y="38" text-anchor="middle" font-size="27" font-weight="bold" fill="#152238">Trzy niezależne if</text>
<text x="930" y="38" text-anchor="middle" font-size="27" font-weight="bold" fill="#152238">Jeden łańcuch if / else if / else</text>
<text x="320" y="68" text-anchor="middle" font-size="18" font-weight="normal" fill="#152238">Każdy warunek sprawdzamy osobno</text>
<text x="930" y="68" text-anchor="middle" font-size="18" font-weight="normal" fill="#152238">Po pierwszym spełnionym warunku kończymy wybór</text>
<text x="351" y="117" text-anchor="middle" font-size="16" font-weight="normal" fill="#152238">tak</text>
